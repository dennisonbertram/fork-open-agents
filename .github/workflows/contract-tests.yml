name: API Contract Tests

# Runs the real-HTTP contract suite (apps/web/tests/contract) against each
# successful non-production preview deployment, using the Vercel automation
# bypass + the dev test-auth cookie. This is a separate, NON-required workflow:
# it gives backend-contract signal on PRs without gating merges. The suite is
# resilient — if a target lacks test-auth, the authenticated suites skip and
# only the auth-gating checks run, so this job stays green rather than flaky.

on:
  deployment_status:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment_status.target_url }}
  cancel-in-progress: true

jobs:
  contract-tests:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.target_url != '' &&
      github.event.deployment.environment != 'Production' &&
      github.event.deployment.environment != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run API contract tests against the preview
        env:
          CONTRACT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun run test:contract
