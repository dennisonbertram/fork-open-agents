name: Scheduled Production Smoke

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-production-smoke
  cancel-in-progress: false

jobs:
  scheduled-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production smoke
        id: smoke
        continue-on-error: true
        env:
          DEPLOYMENT_URL: ${{ vars.PRODUCTION_URL || 'https://open-agents-azure-xi.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          bun run --cwd apps/web preview:smoke 2>&1 | tee smoke.log

      - name: Alert on failure
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run --cwd apps/web ops:alert -- \
            --source public-smoke \
            --environment production \
            --status failing \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --summary "$(tail -n 40 smoke.log)"

      - name: Mark recovery
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run --cwd apps/web ops:alert -- \
            --source public-smoke \
            --environment production \
            --status recovered \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --summary "Scheduled production smoke passed."

      - name: Fail workflow when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
