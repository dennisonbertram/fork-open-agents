name: Authenticated Production Canary

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: authenticated-production-canary
  cancel-in-progress: false

jobs:
  authenticated-production-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run authenticated canary
        id: canary
        continue-on-error: true
        env:
          PRODUCTION_CANARY_URL: ${{ vars.PRODUCTION_URL || 'https://open-agents-azure-xi.vercel.app' }}
          PRODUCTION_CANARY_REPO: ${{ vars.PRODUCTION_CANARY_REPO }}
          PRODUCTION_CANARY_IDENTITY: ${{ vars.PRODUCTION_CANARY_IDENTITY }}
          PRODUCTION_CANARY_AUTH_COOKIE: ${{ secrets.PRODUCTION_CANARY_AUTH_COOKIE }}
        run: |
          bun run --cwd apps/web ops:authenticated-canary 2>&1 | tee canary.log

      - name: Alert on canary failure
        if: steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run --cwd apps/web ops:alert -- \
            --source authenticated-canary \
            --environment production \
            --status failing \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --summary "$(tail -n 60 canary.log)"

      - name: Mark canary recovery
        if: steps.canary.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run --cwd apps/web ops:alert -- \
            --source authenticated-canary \
            --environment production \
            --status recovered \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --summary "Authenticated canary passed or is blocked by explicit configuration."

      - name: Fail workflow when canary failed
        if: steps.canary.outcome == 'failure'
        run: exit 1
